<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=yes">
<title>Room 6 Daily Agenda</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fffdfb;font-family:Arial,Helvetica,sans-serif}
#agendaFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fffdfb}
#accessBar{position:fixed;top:10px;right:10px;z-index:999999;display:flex;gap:8px;align-items:center;padding:8px;background:rgba(38,54,75,.96);border-radius:16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
#accessBar button{border:0;border-radius:11px;background:#fff;color:#26364b;font-weight:800;font-size:20px;min-width:52px;min-height:48px;padding:8px 14px;cursor:pointer}
#accessBar button.full{background:#f2dda0;min-width:150px}
#zoomLabel{color:#fff;font-size:18px;font-weight:800;min-width:58px;text-align:center}
#hideBtn{background:#dfeeda!important}
@media(max-width:900px){#accessBar{top:6px;right:6px;padding:6px;gap:5px}#accessBar button{font-size:17px;min-height:44px;padding:6px 10px}.full{min-width:120px!important}#zoomLabel{font-size:15px}}
</style>
</head>
<body>
<iframe id="agendaFrame" src="agenda.html" title="Room 6 Daily Agenda"></iframe>
<div id="accessBar" aria-label="Display controls">
<button type="button" id="smaller" aria-label="Make agenda smaller">A−</button>
<span id="zoomLabel">125%</span>
<button type="button" id="larger" aria-label="Make agenda larger">A+</button>
<button type="button" id="fullscreen" class="full">⛶ FULL SCREEN</button>
<button type="button" id="hideBtn" aria-label="Hide display controls">Hide</button>
</div>
<script>
(function(){
 const frame=document.getElementById('agendaFrame');
 const bar=document.getElementById('accessBar');
 const label=document.getElementById('zoomLabel');
 let zoom=parseFloat(localStorage.getItem('room6-display-zoom')||'1.25');
 zoom=Math.max(1,Math.min(1.6,zoom));
 function applyZoom(){
   label.textContent=Math.round(zoom*100)+'%';
   localStorage.setItem('room6-display-zoom',String(zoom));
   try{
     const d=frame.contentDocument;
     if(!d)return;
     d.documentElement.style.zoom=String(zoom);
     d.body.style.margin='0';
     d.body.style.minHeight='100vh';
     let s=d.getElementById('room6-accessibility-style');
     if(!s){
       s=d.createElement('style');
       s.id='room6-accessibility-style';
       s.textContent='button,input,select,textarea{font-size:max(18px,1em)!important} .btn,.button{min-height:48px!important}';
       d.head.appendChild(s);
     }
   }catch(e){}
 }
 frame.addEventListener('load',()=>setTimeout(applyZoom,60));
 document.getElementById('larger').onclick=()=>{zoom=Math.min(1.6,Math.round((zoom+.1)*10)/10);applyZoom();};
 document.getElementById('smaller').onclick=()=>{zoom=Math.max(1,Math.round((zoom-.1)*10)/10);applyZoom();};
 document.getElementById('fullscreen').onclick=async()=>{
   try{
     if(!document.fullscreenElement){await document.documentElement.requestFullscreen();}
     else{await document.exitFullscreen();}
   }catch(e){}
 };
 document.addEventListener('fullscreenchange',()=>{
   document.getElementById('fullscreen').textContent=document.fullscreenElement?'↙ EXIT FULL SCREEN':'⛶ FULL SCREEN';
 });
 document.getElementById('hideBtn').onclick=()=>{
   bar.style.display='none';
   const show=document.createElement('button');
   show.id='showControls';show.textContent='Aa';show.title='Show display controls';
   show.style.cssText='position:fixed;top:10px;right:10px;z-index:999999;border:0;border-radius:12px;background:#26364b;color:white;font-weight:800;font-size:22px;width:54px;height:48px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer';
   show.onclick=()=>{show.remove();bar.style.display='flex';};
   document.body.appendChild(show);
 };
})();
</script>
</body>
</html>
