<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Room 6 Daily Agenda</title><link rel="stylesheet" href="agenda2.css"></head><body>
<iframe id="assetFrame" class="assetFrame" src="agenda.html" aria-hidden="true"></iframe>
<div class="app"><div class="top"><strong>Room 6 · Daily Agenda</strong><span class="date" id="dateLabel"></span><span class="spacer"></span><button class="present" id="present">▣ Present</button><button class="timer" id="timerBtn">⏱ Timer</button><button class="staff" id="staffBtn">🔒 Staff</button></div><div class="stage"><div class="noSchoolScreen" id="noSchoolScreen"><div><h1>No School Today</h1><p id="noSchoolText"></p></div></div><div id="slides"></div></div><button class="nav prev" id="prev">‹</button><button class="nav next" id="next">›</button><nav class="film" id="film"></nav>
<aside class="dock"><div class="dockTitle">Staff Links</div><a id="morningLink" href="#" target="_blank">🌅 Morning Group</a><a id="musicLink" href="#" target="_blank">♫ Calming Music</a><button id="dockTimer">⏱ Visual Timer</button><button id="dockPresent">▣ Full Screen</button><button id="dockStaff">🔒 Staff Mode</button><div class="staffOnly"><button class="impact beh" data-impact="behavior">⚠ Behavior Impacted</button></div><div class="staffOnly"><button class="impact evac" data-impact="evacuated">🚪 Evacuated</button></div><div class="staffOnly"><button class="impact noSchool" id="quickNoSchool">❄ No School</button></div></aside>
<aside class="panel" id="panel"><h2>Staff Mode</h2><div style="font-size:13px;font-weight:800;color:#6c6470">Changes save on this computer for this date.</div><h3>Today</h3><label>What's important today?</label><textarea id="important"></textarea><label class="toggle"><input type="checkbox" id="noSchool"> No School Today</label><label>No school reason</label><input type="text" id="noSchoolReason" placeholder="Snow day / building closed"><label>Lunch menu (one item per line)</label><textarea id="lunchMenu"></textarea><h3>Staff Absent</h3><label class="toggle"><input type="checkbox" data-staff="Ms. Betsy"> Ms. Betsy</label><label class="toggle"><input type="checkbox" data-staff="Ms. Katie"> Ms. Katie</label><label class="toggle"><input type="checkbox" data-staff="Mr. Tim"> Mr. Tim</label><h3>Selected Activity</h3><div id="selectedTitle" style="font-size:19px;font-weight:900;color:#0f487d"></div><label>Participation notes</label><textarea id="partNote"></textarea><label class="toggle"><input type="checkbox" id="behavior"> Behavior impacted task/work/lesson</label><label class="toggle"><input type="checkbox" id="evac"> Evacuation / room cleared</label><label>Activity impact note</label><textarea id="impactNote"></textarea><h3>Support Links</h3><label>Morning Group link</label><input type="url" id="morningUrl"><label>Calming Music YouTube link</label><input type="url" id="musicUrl"><h3>Enrichments Videos</h3><label>YouTube video 1</label><input type="url" id="video1"><label>YouTube video 2</label><input type="url" id="video2"><label>YouTube video 3</label><input type="url" id="video3"><button class="closePanel" id="closePanel">Close Staff Mode</button></aside>
<div class="timerOverlay" id="timerOverlay"><button class="closeTimer" id="timerClose">✕ CLOSE TIMER</button><div class="timerPanel"><div class="timerDisk" id="timerDisk"></div><div class="digital" id="digital">10:00</div><div class="timerControls" id="presets"></div><div class="customTimer"><label>Custom minutes <input type="number" id="customMinutes" min="1" max="180" value="10"></label><button id="customStart">Start Custom</button></div><div class="timerControls"><button class="start" id="timerStart">Start</button><button class="reset" id="timerReset">Reset</button></div></div></div></div><script src="agenda2-1.js"></script><script src="agenda2-2.js"></script><script src="agenda2-3.js"></script></body></html>
